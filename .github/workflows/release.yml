# Every push to main publishes a release with excalisave.zip attached.
# The release version is the manifest version plus the run number
# (manifest "1.0.0" + run 7 -> v1.0.0.7), stamped into the zipped manifest
# so chrome://extensions shows the same version as the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          version="$(jq -r .version manifest.json).${{ github.run_number }}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir excalisave
          cp content.js README.md excalisave/
          jq --arg v "$version" '.version = $v' manifest.json > excalisave/manifest.json
          zip -r excalisave.zip excalisave
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" excalisave.zip \
            --title "Excalisave $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest
